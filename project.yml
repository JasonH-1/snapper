name: Snapper

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

fileGroups:
  - Config
  - README.md

targets:
  Snapper:
    type: application
    platform: iOS
    sources:
      - path: Snapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        INFOPLIST_FILE: Snapper/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  SnapperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnapperTests
      - path: Config/Snapper.storekit
        buildPhase: resources
    dependencies:
      - target: Snapper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).tests"

schemes:
  Snapper:
    build:
      targets:
        Snapper: all
        SnapperTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/Snapper.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SnapperTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
