# Snapper looks — design parameters.
#
# Each [[look]] is turned into Snapper/Resources/Filters/LUTs/<id>.cube by
#     python3 tools/lutgen/lutgen.py build
# Tweak a number, rebuild, then `lutgen.py review` to see the contact sheets.
#
# Parameter reference (all optional; omitted = neutral):
#   temperature      -1..1   white balance, + warmer (Bradford adaptation)
#   tint             -1..1   + magenta, - green
#   exposure         EV      brightness in linear light
#   highlight_rolloff 0..1   soft shoulder so highlights never clip (default 0.35)
#   contrast         -1..1   S-curve around `pivot` (default pivot 0.45)
#   curve            [[in,out], ...]  master tone curve (monotone cubic)
#   curve_r/g/b      per-channel curves (for colour crossovers)
#   black / white    output black level (fade) and white point
#   saturation       chroma multiplier; vibrance boosts muted colours more
#   hue_sat / hue_shift / hue_light   per hue family:
#                    red orange yellow green aqua blue purple magenta
#                    (saturation multiplier / hue degrees / lightness)
#   shadow_tint / highlight_tint = { hue = <Oklab degrees>, amount = <chroma> }
#                    hue guide: 25 red, 55 orange, 75 amber, 100 yellow,
#                    145 green, 200 teal, 255 blue, 300 violet, 340 pink
#   split_balance    -1..1   moves the shadow/highlight split point
#   shadow_desat / highlight_desat  0..1  film-like colour rolloff
#   skin_protect     0..1   keeps skin hue/chroma natural (default 0.7)
#   monochrome, mono_tone   black & white with an optional tone
#
# Effects (optional) are drawn by the app after the cube, so they are not in
# the .cube files, the quality gates or the contact sheets: check them in the
# app. Add one as a sub-table after the look's other keys, e.g.
#     [look.effects.glow]
#     intensity = 0.8
# Lengths are fractions of the photo's shorter side. Omitted values use the
# defaults in effects.py:
#   gradient              size, exposure, tint_hue, tint   (graduated filter from the top)
#   flash                 exposure, falloff, radius, tint_hue, tint   (direct on-camera flash)
#   glow                  threshold, radius, intensity, saturation, tint_hue, tint
#   smear                 threshold, length, intensity, tint_hue, tint   (CCD vertical streaks)
#   halation              threshold, radius, intensity   (red-orange film halo)
#   chromatic_aberration  amount
#   chroma_bleed          radius
#   glitch                slices, shift, rgb_split
#   light_leak            intensity, size, tint_hue   (side/height vary per photo)
#   scanlines             spacing, intensity
#   sharpen               amount, radius   (crunchy in-camera sharpening)
#   noise                 amount, size
#   grain                 amount, size, roughness, color   (film grain)
#   vignette              intensity, radius

[collections.disposable]
name = "Disposable"
tagline = "Sun-faded, warm and a little overexposed, like a 90s throwaway camera."

[collections.neon]
name = "Neon Nights"
tagline = "Teal shadows, warm skin and glowing signs for the city after dark."

[collections.soft]
name = "Soft Portrait"
tagline = "Gentle contrast, creamy highlights and skin that looks like skin."

[collections.overclock]
name = "Overclock"
tagline = "Neon glow, broken signals and chrome-edged colour from a future that never happened."

[collections.darkroom]
name = "Darkroom"
tagline = "Grain, halation and faded colour from old film and shoebox prints."

[collections.digicam]
name = "Digicam"
tagline = "Harsh flash, cool skin and crunchy pixels from a 2000s pocket camera."

